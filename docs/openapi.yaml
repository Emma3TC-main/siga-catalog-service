openapi: 3.0.3
info:
  title: SIGA Catalog API
  version: 1.2.0
  description: Categories, products, suppliers, UoM and multiple per-product unit conversions.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /products:
    get:
      summary: List/filter products
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: ['sku,asc', 'sku,desc', 'name,asc', 'name,desc'], default: 'sku,asc' } }
        - { in: query, name: q, schema: { type: string }, description: Case-insensitive literal substring of SKU or name; percent and underscore are literals. }
        - { in: query, name: active, schema: { type: boolean }, description: Omitting includes active and inactive products. }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: productType, schema: { type: string, enum: [MATERIAL, INSUMO, REPUESTO, MAQUINARIA] } }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      summary: Create product, its conversions and a pending ProductCreated v1 outbox event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ReferenceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
    put:
      summary: Update product, traceability and conversions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /suppliers:
    get:
      summary: List/filter suppliers
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: ['code,asc', 'code,desc', 'businessName,asc', 'businessName,desc'], default: 'code,asc' } }
        - { in: query, name: active, schema: { type: boolean }, description: Omitting includes active and inactive suppliers. }
        - { in: query, name: q, schema: { type: string }, description: Case-insensitive literal substring of code, taxId, businessName or tradeName; percent and underscore are literals. }
      responses:
        '200':
          description: Supplier page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreateRequest' }
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get supplier
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SupplierNotFound' }
    put:
      summary: Update or deactivate supplier without deleting history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierUpdateRequest' }
      responses:
        '200':
          description: Supplier updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SupplierNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories:
    get:
      summary: List categories ordered by code, including active and inactive records
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }
    post:
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201': { description: Category created }
  /units:
    get:
      summary: List units ordered by code, including active and inactive records
      responses:
        '200':
          description: Units
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnitResponse' }
    post:
      summary: Create unit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnitRequest' }
      responses:
        '201': { description: Unit created }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: SUPPLIER_MANAGE permission required
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Duplicate/version/domain conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Invalid request or conversion
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ReferenceNotFound:
      description: Category or unit of measure does not exist
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProductNotFound:
      description: Product does not exist
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    SupplierNotFound:
      description: Supplier does not exist
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string, format: uuid }
        field: { type: string }
    SupplierFields:
      type: object
      required: [code, taxId, businessName]
      properties:
        code: { type: string, maxLength: 50 }
        taxId: { type: string, maxLength: 20, description: RUC u otro identificador tributario parametrizable }
        businessName: { type: string, maxLength: 200 }
        tradeName: { type: string, maxLength: 200 }
        contactName: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, maxLength: 300 }
    SupplierCreateRequest:
      allOf:
        - $ref: '#/components/schemas/SupplierFields'
        - type: object
          properties:
            active: { type: boolean, default: true, description: Must be omitted or true. }
    SupplierUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/SupplierFields'
        - type: object
          required: [active, expectedVersion]
          properties:
            active: { type: boolean }
            expectedVersion: { type: integer, format: int64, minimum: 0 }
    SupplierResponse:
      allOf:
        - $ref: '#/components/schemas/SupplierFields'
        - type: object
          required: [id, active, version]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
    SupplierPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SupplierResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    CategoryRequest:
      type: object
      required: [code, name, categoryType]
      properties:
        code: { type: string }
        name: { type: string }
        categoryType: { type: string, enum: [MATERIAL, INSUMO, REPUESTO, MAQUINARIA] }
    CategoryResponse:
      type: object
      required: [id, code, name, categoryType, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        categoryType: { type: string, enum: [MATERIAL, INSUMO, REPUESTO, MAQUINARIA] }
        active: { type: boolean }
    UnitRequest:
      type: object
      required: [code, name, symbol, dimension]
      properties:
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        dimension: { type: string }
    UnitResponse:
      type: object
      required: [id, code, name, symbol, dimension, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        symbol: { type: string }
        dimension: { type: string }
        active: { type: boolean }
    UnitConversionRequest:
      type: object
      required: [fromUnitId, toUnitId, factor]
      properties:
        fromUnitId: { type: string, format: uuid }
        toUnitId: { type: string, format: uuid }
        factor: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.000001 }
        active: { type: boolean, default: true }
    ProductRequest:
      type: object
      required: [sku, name, categoryId, productType, storageUnitId, baseUnitId]
      properties:
        sku: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 200 }
        categoryId: { type: string, format: uuid }
        productType: { type: string, enum: [MATERIAL, INSUMO, REPUESTO, MAQUINARIA] }
        storageUnitId: { type: string, format: uuid }
        baseUnitId: { type: string, format: uuid }
        minStock: { type: number, minimum: 0, multipleOf: 0.000001 }
        requiresLot: { type: boolean, default: false }
        requiresHeatNumber: { type: boolean, default: false }
        requiresExpiry: { type: boolean, default: false }
        requiresSerial: { type: boolean, default: false }
        technicalAttributes: { type: object, additionalProperties: true }
        conversions:
          type: array
          items: { $ref: '#/components/schemas/UnitConversionRequest' }
    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/ProductRequest'
        - type: object
          required: [id, active, version]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
    ProductPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
